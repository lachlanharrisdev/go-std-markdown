codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: "80...100"

  status:
    project:
      default:
        target: 85%
        threshold: 1%
        base: auto
    patch:
      default:
        target: 90%
        threshold: 1%

comment:
  layout: "diff, flags, files"
  behavior: default
  require_changes: true

parsers:
  go:
    partials_as_hits: true

ignore:
  - "internal/debug"
  - "testdata"
